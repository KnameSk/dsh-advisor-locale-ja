name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No dependency install: the package ships its sources and needs no runtime
      # dependencies, so verification runs on a bare runner.
      - run: npm run check
      - run: npm test
